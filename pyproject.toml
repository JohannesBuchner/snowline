[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snowline"
version = "0.6.6"
description = "Fit and compare complex models quickly. Laplace Approximation, Variational Bayes, Importance Sampling."
authors = [
    {name = "Johannes Buchner", email = "johannes.buchner.acad@gmx.com"}
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
]
dependencies = ["numpy", "scipy", "pypmc", "iminuit"]
keywords = ["snowline"]
dynamic = ["readme"]

[project.optional-dependencies]
plot = ["matplotlib", "corner"]

[project.urls]
Homepage = "https://github.com/JohannesBuchner/snowline"
Source = "https://github.com/JohannesBuchner/snowline"
Documentation = "https://johannesbuchner.github.io/snowline/"

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "HISTORY.rst"]}

[tool.bumpversion]
current_version = "0.6.6"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "snowline.py"
search = "__version__ = '{current_version}'"
replace = "__version__ = '{new_version}'"

