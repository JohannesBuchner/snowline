[aliases]
# Define setup.py command aliases here
test = pytest

[flake8]
exclude = docs
extend-ignore = E501,F401,E128,E231,E124,W293,W291,E302,E306,E303,E225,E722,E265,E262,E261
style = numpy
check-return-types = false

[pycodestyle]
count = false
ignore = W191,W291,W293,E231,E225,E302,E306,E303,E226,E722,E265,E262,E261
max-line-length = 160
statistics = false

[pydocstyle]
add-ignore = D107
